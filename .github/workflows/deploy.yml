name: ML CI/CD Pipeline

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ml-app

jobs:

# -------------------------
# Parallel Jobs (FAST)
# -------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Running tests..."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Linting code..."

# -------------------------
# Build + Push (with caching)
# -------------------------
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build and Push Image (with caching)
        run: |
          docker buildx build \
            --cache-from=type=registry,ref=${{ secrets.DOCKER_USER }}/ml-app:cache \
            --cache-to=type=registry,ref=${{ secrets.DOCKER_USER }}/ml-app:cache,mode=max \
            -t ${{ secrets.DOCKER_USER }}/ml-app:latest \
            --push .

# -------------------------
# Deploy to EC2
# -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
         script: |
           sudo docker pull ${{ secrets.DOCKER_USER }}/ml-app:latest
           sudo docker rm -f $(sudo docker ps -aq) || true
           sudo docker run -d -p 5000:5000 \
             --restart=always \
             --name ml-app \
             ${{ secrets.DOCKER_USER }}/ml-app:latest

